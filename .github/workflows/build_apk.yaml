
name: Build Android APK

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]
  workflow_dispatch:

# Required to upload/replace release assets
permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Build Environment
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          INGEST_API_KEY: ${{ secrets.INGEST_API_KEY }}
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          elif [ ! -f .env ]; then
            touch .env
          fi

          if [ -n "$INGEST_API_KEY" ]; then
            grep -v '^INGEST_API_KEY=' .env > .env.tmp || true
            printf 'INGEST_API_KEY=%s\n' "$INGEST_API_KEY" >> .env.tmp
            mv .env.tmp .env
          fi

          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: Build Debug APK
        env:
          INGEST_API_KEY: ${{ secrets.INGEST_API_KEY }}
        run: |
          if [ -f gradlew ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/vu-lms-reminder-app-v2.0.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vu-lms-reminder-app-v2.0.0
          path: app/build/outputs/apk/debug/vu-lms-reminder-app-v2.0.0.apk
          retention-days: 30

      # Replace existing APK in GitHub Release
      - name: Update GitHub Release APK
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v2.0.0 \
            app/build/outputs/apk/debug/vu-lms-reminder-app-v2.0.0.apk \
            --clobber \
            --repo "${{ github.repository }}"
